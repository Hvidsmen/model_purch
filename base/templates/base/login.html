{% load static %}
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход · Рабочий портал</title><link rel="stylesheet" href="{% static 'base/portal.css' %}"></head>
<body class="portal-body"><main class="portal-login"><h1>Рабочий портал</h1><p>Войдите под своей учётной записью.</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}<label for="id_username">Имя пользователя</label>{{ form.username }}{{ form.username.errors }}<label for="id_password">Пароль</label>{{ form.password }}{{ form.password.errors }}<input type="hidden" name="next" value="{{ next }}"><button type="submit">Войти</button></form><p>Для получения доступа обратитесь к администратору.</p></main></body></html>
