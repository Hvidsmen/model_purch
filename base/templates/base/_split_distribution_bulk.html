<style>.split-distribution-fill [hidden]{display:none!important}</style>
<details class="split-distribution-bulk"><summary>Заполнить распределение</summary>
<div class="split-distribution-fill"><label>Применить к <select data-grid-scope><option value="all">Всем показанным строкам бренда</option><option value="selected">Выбранным строкам</option></select></label>
<label>Способ <select data-grid-bulk-mode aria-label="Способ массового распределения"><option value="fact">По истории продаж</option><option value="equal">Равномерно</option><option value="manual">Вручную</option>{% if power_methods %}<option value="stock_ddp">DDP из стока · модели и стоимость</option>{% endif %}</select></label>
<label data-grid-share-empty><input type="checkbox" data-grid-only-empty checked> Только незаполненные строки</label>{% if power_methods %}<label data-power-stock-options hidden>Стоимость <select data-power-stock-fill><option value="1">Дозаписать пустые параметры</option><option value="0">Перезаписать параметры стоимости</option></select></label>{% endif %}<button type="button" class="admin-button" data-grid-bulk-apply>Заполнить</button></div>
<small data-grid-fill-help>Заполненные и частично введённые доли сохраняются, пока включено «Только незаполненные». История показывает период и источник в подробностях строки. Результат заполнения сначала проверяется в таблице, затем сохраняется.</small>
<div data-grid-selection-toolbar hidden><button type="button" class="admin-button secondary" data-grid-select-all>Выбрать все показанные</button><button type="button" class="admin-button secondary" data-grid-select-none>Снять выбор</button><span role="status" data-grid-selected-count>Выбрано строк: 0</span></div><p role="status" data-grid-bulk-result></p></details>
