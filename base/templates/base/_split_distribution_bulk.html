<div class="split-distribution-bulk">
<button type="button" class="admin-button secondary" data-grid-select-all>Выбрать все показанные</button>
<button type="button" class="admin-button secondary" data-grid-select-none>Снять выбор</button>
<span role="status" data-grid-selected-count>Выбрано строк: 0</span>
<label>Способ распределения <select data-grid-bulk-mode aria-label="Способ массового распределения"><option value="fact">Из факта</option><option value="equal">Равномерно</option><option value="manual">Вручную</option></select></label>
<button type="button" class="admin-button" data-grid-bulk-apply disabled>Применить к выбранным</button>
<p>Действие применяется к выбранным строкам, показанным по текущим фильтрам. «Вручную» открывает ввод и сохраняет текущие доли. После проверки нажмите «Сохранить изменения».</p>
<p role="status" data-grid-bulk-result></p>
</div>
