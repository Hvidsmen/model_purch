<details class="split-group-picker" data-group-picker><summary>Группы · <span data-group-picker-caption>Все</span></summary><div class="split-group-picker-popup"><input type="search" data-group-picker-search aria-label="Найти группу планирования" placeholder="Найти группу"><div class="split-group-picker-actions"><button type="button" class="admin-button secondary" data-group-picker-all>Все группы</button><button type="button" class="admin-button secondary" data-group-picker-found>Выбрать найденные</button><button type="button" class="admin-button secondary" data-group-picker-none>Снять выбор</button></div><div class="split-group-picker-list">{% for gid,g in state.groups.items %}<label><input type="checkbox" data-group-choice="{{ gid }}" checked><span>{{ g.ref.name }}</span></label>{% endfor %}</div><small data-group-picker-empty hidden>Группы не найдены</small><small data-group-picker-count></small><small>Только группы выбранных брендов. Фильтр меняет показ строк; итоги включают все группы выбранных брендов.</small></div></details>
