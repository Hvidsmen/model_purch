<form method="post" data-archive-scenario-form>{% csrf_token %}<input type="hidden" name="revision" value="{{ scenario.revision }}"><button type="submit" class="admin-button secondary" name="action" value="{% if scenario.archived_at %}restore_scenario{% else %}archive_scenario{% endif %}">{% if scenario.archived_at %}Восстановить из архива{% else %}В архив{% endif %}</button></form>
{% if scenario.archived_at %}<p role="status">Сценарий в архиве с {{ scenario.archived_at|date:'d.m.Y H:i' }}. Данные сохранены. <a href="{% url 'sales_planning_split' %}?archived=1">Открыть архив →</a></p>{% endif %}
