{% if brand_page %}
<nav class="split-brand-pages split-brand-picker" aria-label="Страницы по брендам" data-brand-pages="{{ brand_page.key }}"><label>Бренд <select data-sales-brand data-searchable-select aria-label="Бренд: выбрать страницу">{% for page in brand_page.pages %}<option value="{{ page.url }}"{% if page.selected %} selected{% endif %}>{{ page.name }} ({{ page.count }})</option>{% endfor %}<option value="{{ brand_page.all_url }}"{% if brand_page.key == '_all_' %} selected{% endif %}>Все бренды</option></select></label>{% if brand_page.previous %}<a class="admin-button secondary" href="{{ brand_page.previous }}" aria-label="Предыдущий бренд">←</a>{% endif %}{% if brand_page.next %}<a class="admin-button secondary" href="{{ brand_page.next }}" aria-label="Следующий бренд">→</a>{% endif %}<small>Групп: {{ brand_page.count }}</small></nav>
{% endif %}
