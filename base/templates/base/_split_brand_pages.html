{% if brand_page %}
<nav class="split-brand-pages split-brand-picker" aria-label="Страницы по брендам" data-brand-pages="{{ brand_page.key }}"><details class="split-brand-multiselect" data-brand-multiselect data-sales-brand><summary>Бренды · {{ brand_page.caption }}</summary><div class="split-brand-popup"><input type="search" data-brand-search aria-label="Поиск бренда" placeholder="Найти бренд"><div><button type="button" data-brands-all>Выбрать все</button><button type="button" data-brands-none>Снять все</button></div>{% for page in brand_page.pages %}<label><input type="checkbox" data-brand-choice="{{ page.key }}"{% if page.selected %} checked{% endif %}><span>{{ page.name }} ({{ page.count }})</span></label>{% endfor %}<small data-brand-error hidden>Выберите хотя бы один бренд.</small><button type="button" class="admin-button" data-brands-apply>Применить</button></div></details>{% if brand_page.previous %}<a class="admin-button secondary" href="{{ brand_page.previous }}" aria-label="Предыдущий бренд">←</a>{% endif %}{% if brand_page.next %}<a class="admin-button secondary" href="{{ brand_page.next }}" aria-label="Следующий бренд">→</a>{% endif %}<small>Групп: {{ brand_page.count }}</small></nav>
{% endif %}
