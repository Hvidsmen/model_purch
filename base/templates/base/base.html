{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- this line add Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'bootstrap-5.0.2-dist/css/bootstrap.min.css' %}">
    <title>
        {% block title %}
        {% endblock title %}
    </title>
</head>
<body>
<br>
<!--header-->

<div class="container">
    <div class="row">
        <div class="col">
            <h1>Портал аналитики</h1>
        </div>
    </div>
</div>

{% block content %}
{% endblock content %}

<!-- these lines adds Bootstrap JS files to our Django project -->
<script src="{% static 'jquery/jquery-3.7.1.min.js' %}"></script>

<script src="{% static 'jquery/popper.min.js' %}"></script>
<script src="{% static 'bootstrap-5.0.2-dist/js/bootstrap.min.js' %}"></script>
</body>
</html>
