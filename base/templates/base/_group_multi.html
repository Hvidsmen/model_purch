<div class="access-field" data-access-multi><span id="{{ field.auto_id }}-label">{{ field.label }}</span><details class="access-multi"><summary aria-labelledby="{{ field.auto_id }}-label"><span data-choice-caption>Выберите значения</span><span aria-hidden="true">⌄</span></summary><div class="access-multi-menu"><input type="search" placeholder="Поиск…" class="access-search" aria-label="Поиск: {{ field.label }}"><div class="access-multi-actions"><button type="button" data-choice-all>Выбрать все</button><button type="button" data-choice-clear>Снять все</button></div><div class="access-multi-options">{% for option in field %}<label data-choice-label>{{ option.tag }}<span>{{ option.choice_label }}</span></label>{% empty %}<p>Список пуст. Обновите соответствующий справочник.</p>{% endfor %}</div><button type="button" data-choice-close class="access-button access-secondary">Готово</button></div></details>{{ field.errors }}<small>{{ hint }}</small></div>
