{% load report_format %}{% for cell in blocks %}<span {% if cell.hidden %}data-dashboard-column="{{ cell.hidden }}" hidden{% endif %} class="report-number {% if cell.percent and cell.value is not None %}{% if cell.value >= 0.8 %}percent-good{% else %}percent-low{% endif %}{% endif %}">{% if cell.reveal %}<button type="button" class="division-metric-toggle" data-dashboard-reveal="{{ cell.reveal }}" aria-expanded="false">{% endif %}{% if cell.percent %}{{ cell.value|report_percent }}{% else %}{{ cell.value|report_money }}{% endif %}{% if cell.reveal %}</button>{% endif %}</span>{% endfor %}
