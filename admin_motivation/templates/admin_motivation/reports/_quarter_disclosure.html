{% load report_format %}<details><summary style="cursor:pointer;white-space:nowrap">{{ amount|report_money }}</summary><dl style="min-width:130px;margin:8px 0;font-weight:400">{% for line in lines %}<div style="display:flex;justify-content:space-between;gap:14px;margin:5px 0"><dt>{{ line.label }}</dt><dd style="margin:0">{{ line.value|report_money }}</dd></div>{% endfor %}</dl></details>
