{% if can_edit_distributions and b.state == 'draft' %}<details style="margin-top:8px"><summary>Удалить черновик</summary><form method="post">{% csrf_token %}<input type="hidden" name="batch" value="{{ b.pk }}"><input type="hidden" name="revision" value="{{ b.revision }}"><p>Черновик исчезнет из списка. Можно будет создать новый за этот период.</p><label>Причина <input name="reason" required maxlength="2000"></label><button class="btn btn-outline-danger" name="action" value="delete_draft">Подтвердить удаление</button></form></details>{% endif %}
{% if is_admin %}<details style="margin-top:8px"><summary>В архив</summary><form method="post">{% csrf_token %}<input type="hidden" name="batch" value="{{ b.pk }}"><input type="hidden" name="revision" value="{{ b.revision }}"><p>Распределение перестанет применяться в отчётах. История сохранится.</p><label>Причина <input name="reason" required maxlength="2000"></label><button class="btn btn-outline-danger" name="action" value="archive">Подтвердить архивирование</button></form></details>{% endif %}
