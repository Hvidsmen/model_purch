{% for filter in filters %}{% if filter.locked %}<label>{{ filter.label }}<input value="{{ filter.locked_value }}" readonly aria-readonly="true"><input type="hidden" name="{{ filter.name }}" value="{{ filter.locked_value }}"></label>{% elif filter.multiple %}{% include 'admin_motivation/reports/_manager_multiselect.html' %}{% else %}<label>{{ filter.label }}<select name="{{ filter.name }}" required><option value="">Выберите значение</option>{% for option in filter.options %}<option value="{{ option.value }}" {% if option.selected %}selected{% endif %}>{{ option.value }}</option>{% endfor %}</select></label>{% endif %}{% endfor %}
