{% load tz %}
<form method="get" class="next-filter" id="native-report-filters">
{% if admin_preview %}<label>Сотрудник для предпросмотра<select name="preview_user" {% if kind == 'mine' %}required{% endif %}><option value="">{% if kind == 'mine' %}Выберите сотрудника{% else %}Обычная детализация{% endif %}</option>{% for employee in preview_accounts %}<option value="{{ employee.pk }}" {% if preview_user.pk == employee.pk %}selected{% endif %}>{{ employee.motivation_report_access.deal_author }} · {{ employee.username }}</option>{% endfor %}</select></label>{% endif %}
<label>Завершённый расчёт<select name="execution">{% for item in runs %}<option value="{{ item.pk }}" data-year="{{ item.parameters.fact_year }}" {% if kind != 'executive' and item.pk != current_execution_id %}disabled{% endif %} {% if item.pk == execution.pk %}selected{% endif %}>{% timezone 'Europe/Moscow' %}{{ item.completed_at|date:'d.m.Y H:i' }}{% endtimezone %} МСК · {{ item.parameters.fact_year }} · {{ item.parameters.plan_version }}{% if kind != 'executive' and item.pk != current_execution_id %} · нет архива сумм{% endif %}</option>{% empty %}<option>Нет расчётов</option>{% endfor %}</select></label>
{% if query.author %}<input type="hidden" name="author" value="{{ query.author }}">{% endif %}<label>Год<input name="year" type="number" min="1900" max="9998" value="{{ query.year }}"></label>
<label>Период премии<select name="period">{% for value,label in periods %}<option value="{{ value }}" {% if query.period == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
<label>Вид мотивации<select name="type">{% if kind != 'detail' %}<option value="">Все доступные</option>{% endif %}{% for item in all_types %}<option {% if query.type == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label>
<div class="nr-field">Подразделения<details class="next-branches"><summary>Все доступные / выбранные</summary><div class="next-branch-options"><input type="search" data-next-branch-search placeholder="Найти подразделение" aria-label="Найти подразделение"><div><button type="button" data-next-select-all>Выбрать все</button> <button type="button" data-next-clear-all>Снять все</button></div>{% for branch in branches %}<label><input type="checkbox" name="subdivision" value="{{ branch.name }}" {% if branch.selected %}checked{% endif %}> {{ branch.name }}</label>{% endfor %}</div></details></div>
{% if kind == 'executive' %}<label>План сравнения<select name="plan"><option value="" {% if not query.plan %}selected{% endif %}>План из расчёта</option>{% for item in plans %}<option value="{{ item.pk }}" {% if query.plan == item.pk|stringformat:'s' %}selected{% endif %}>{{ item.title }}</option>{% endfor %}</select></label>{% else %}<label>Валюта<select name="currency"><option {% if query.currency == 'USD' %}selected{% endif %}>USD</option><option {% if query.currency == 'RUB' %}selected{% endif %}>RUB</option></select></label>{% endif %}
<button class="btn btn-primary" name="run" value="1">Показать</button></form>
