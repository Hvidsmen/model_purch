<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Обновление портала</title><style>
body{margin:0;background:#f4f6fb;color:#29394d;font:15px system-ui,sans-serif}main{max-width:900px;margin:7vh auto;padding:26px;background:white;border:1px solid #dfe4ef;border-radius:14px}h1{font-size:26px}h2{font-size:18px}progress{width:100%;height:18px;accent-color:#6852cf}.update-muted{color:#64748b;font-size:13px}.update-error{background:#fff1f2;color:#a61e39;padding:14px;border-radius:8px}button{background:#6852cf;color:white;border:0;border-radius:6px;padding:11px 16px}button:disabled{opacity:.5}a{color:#6852cf}li{margin:8px 0}.update-status{display:flex;justify-content:space-between;gap:10px}details{margin-top:20px}@media(max-width:950px){main{margin:20px 12px;padding:18px}}
</style></head><body><main id="portal-updates" data-base="/accounts/updates/" data-maintenance="true"><h1>Обновление портала</h1><p class="update-muted">Портал временно остановлен. Эту страницу обслуживает отдельное задание обновления.</p><section id="update-status-card"><h2>Ход обновления</h2><div class="update-status"><strong id="update-stage">Подключение к заданию</strong><span class="update-muted" id="update-elapsed"></span></div><progress id="update-progress" value="0" max="100" aria-label="Выполненные этапы обновления"></progress><p id="update-detail" class="update-muted"></p><p id="update-connection" role="status" class="update-muted"></p><p id="update-error" class="update-error" role="alert" hidden></p><button id="update-retry" hidden>Повторить обновление</button><a href="/" id="update-open" hidden>Открыть портал →</a><details><summary>Этапы и время</summary><ol id="update-events"></ol></details></section><p id="update-action-error" class="update-error" role="alert" hidden></p></main><script src="/accounts/updates/maintenance.js" defer></script></body></html>
