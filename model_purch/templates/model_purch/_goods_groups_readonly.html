<section class="card card-body"><h1 class="h4">Группы и пошлины</h1><p>Сохранённые параметры групп товаров.</p><div class="table-responsive"><table class="table"><thead><tr><th>Группа товаров</th><th>Пошлина, %</th><th>Объём контейнера, м³</th></tr></thead><tbody>{% for item in groups %}<tr><td>{{ item.name }}</td><td>{{ item.duty_rate }}</td><td>{{ item.container_volume }}</td></tr>{% empty %}<tr><td colspan="3">Группы ещё не созданы.</td></tr>{% endfor %}</tbody></table></div></section>
