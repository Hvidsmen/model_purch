<label class="ddp-reference-filter"><span>{{ filter.label }}</span><select name="{{ filter.key }}" aria-label="{{ filter.label }}" data-searchable-select><option value="">Все</option><option value="__empty__"{% if filter.value == '__empty__' %} selected{% endif %}>Не заполнено</option>{% for value in filter.options %}<option value="{{ value }}"{% if value == filter.value %} selected{% endif %}>{{ value }}</option>{% endfor %}</select></label>
