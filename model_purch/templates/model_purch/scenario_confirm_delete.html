{% extends 'model_purch\base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0">Подтверждение удаления</h5>
                </div>
                <div class="card-body">
                    <p class="mb-3">
                        Вы уверены, что хотите удалить сценарий 
                        <strong>"{{ scenario.name }}"</strong>?
                    </p>
                    <p class="text-danger">
                        <i class="fas fa-exclamation-triangle"></i>
                        Все связанные планы продаж также будут удалены!
                    </p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'scenario_list' %}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Отмена
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash"></i> Удалить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
